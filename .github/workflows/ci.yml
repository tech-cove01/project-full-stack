name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-go
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: project_full_stack_go
          MYSQL_USER: fullstack
          MYSQL_PASSWORD: fullstack_go_dev_only
          MYSQL_ROOT_PASSWORD: root_go_dev_only
          TZ: Asia/Shanghai
        ports: ['3308:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot_go_dev_only --silent"
          --health-interval=5s --health-timeout=3s --health-retries=40
      redis:
        image: redis:7.4-alpine
        ports: ['6380:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=3s --health-timeout=3s --health-retries=20
    env:
      GOTOOLCHAIN: local
      GO_ENV: development
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: '3308'
      MYSQL_DATABASE: project_full_stack_go
      MYSQL_USER: fullstack
      MYSQL_PASSWORD: fullstack_go_dev_only
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6380'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: go mod verify
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Initialize isolated SQL schema
        run: >-
          docker exec -i -e MYSQL_PWD=fullstack_go_dev_only
          '${{ job.services.mysql.id }}' mysql --user=fullstack
          --default-character-set=utf8mb4 project_full_stack_go
          < ../infra/mysql/001-schema.sql
      - name: Auth against real MySQL and Redis
        run: go test -race -count=1 -v ./internal/auth
        env:
          GO_INTEGRATION: '1'
      - name: Apply versioned SQL to the isolated database
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
          MYSQL_PORT: '3306'
          MIGRATIONS_DIR: ../infra/mysql/migrations
        run: |
          cat > "$RUNNER_TEMP/mysql-go" <<'SH'
          #!/usr/bin/env bash
          exec docker exec -i -e MYSQL_PWD="$MYSQL_PWD" "$MYSQL_CONTAINER" mysql "$@"
          SH
          chmod +x "$RUNNER_TEMP/mysql-go"
          MYSQL_BIN="$RUNNER_TEMP/mysql-go" node ../scripts/migrate.mjs
          MYSQL_BIN="$RUNNER_TEMP/mysql-go" node ../scripts/migrate.mjs
      - name: Shops against real MySQL
        run: go test -race -count=1 -v ./internal/shop
        env:
          GO_INTEGRATION: '1'
      - name: Merchant permissions against real MySQL and Redis
        run: go test -race -count=1 -v ./internal/merchant
        env:
          GO_INTEGRATION: '1'
      - name: Activities and publication against real MySQL and Redis
        run: go test -race -count=1 -p 1 -v ./internal/activity ./internal/activitypub ./internal/outbox
        env:
          GO_INTEGRATION: '1'
          GIN_MODE: release
      - name: Order admission persistence and recovery against real MySQL and Redis
        run: go test -race -count=1 -p 1 -v ./internal/orderadmission ./internal/order ./internal/orderstream ./internal/ordertimeout
        env:
          GO_INTEGRATION: '1'
          GIN_MODE: release
      - run: go build -trimpath -o bin/api ./cmd/api
      - run: python3 ../scripts/go-bootstrap-smoke.py --binary bin/api --output bootstrap-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-bootstrap-evidence
          path: backend-go/bootstrap-result.json

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn -B -ntp -f backend/pom.xml verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
