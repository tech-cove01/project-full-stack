name: project-full-stack-go

# Separate project, ports and volumes: never attaches to the Java baseline data.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: project_full_stack_go
      MYSQL_USER: fullstack
      MYSQL_PASSWORD: fullstack_go_dev_only
      MYSQL_ROOT_PASSWORD: root_go_dev_only
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${GO_MYSQL_PORT:-3308}:3306"
    volumes:
      - go-mysql-data:/var/lib/mysql
      - ./infra/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 3s
      timeout: 3s
      retries: 40
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "127.0.0.1:${GO_REDIS_PORT:-6380}:6379"
    volumes:
      - go-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Opt-in search instance; CJK analysis is built in, with no plugin download.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.23
    profiles: ["search"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    mem_limit: 1g
    ports:
      - "127.0.0.1:${GO_ES_PORT:-9202}:9200"
    volumes:
      - go-search-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=3s' >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40

  # Opt-in single-node KRaft broker. `docker compose -f compose.go.yaml --profile kafka up -d`
  # The application treats an empty KAFKA_BROKERS as "relay disabled", so the
  # default profile stays a two-container local environment.
  kafka:
    image: apache/kafka:3.9.0
    profiles: ["kafka"]
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Bind to every interface but never advertise the 0.0.0.0 meta-address:
      # Kafka rejects it during storage formatting.
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:${GO_KAFKA_PORT:-9092},INTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      # The image defaults to /tmp; point it at the named volume so a container
      # recreation keeps the log, and let the relay create its topic on first write.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "127.0.0.1:${GO_KAFKA_PORT:-9092}:9092"
    volumes:
      - go-kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9094 >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  go-mysql-data:
  go-redis-data:
  go-kafka-data:
  go-search-data:
