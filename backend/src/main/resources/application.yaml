server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: project-full-stack
  profiles:
    default: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:project_full_stack}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: ${MYSQL_USER:fullstack}
    password: ${MYSQL_PASSWORD:fullstack_dev_only}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 0
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  jackson:
    default-property-inclusion: non_null
mybatis-plus:
  type-aliases-package: com.fullstack.platform.entity
  configuration:
    map-underscore-to-camel-case: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
ai:
  enabled: ${AI_ENABLED:false}
  provider: ${AI_PROVIDER:stub}
  api-key: ${AI_API_KEY:}
  base-url: ${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
  chat-model: ${AI_CHAT_MODEL:qwen-plus}
  embedding-model: ${AI_EMBEDDING_MODEL:text-embedding-v4}
  embedding-dimensions: ${AI_EMBEDDING_DIMENSIONS:1024}
  top-k: ${AI_TOP_K:5}
  min-score: ${AI_MIN_SCORE:0.18}
  max-input-chars: ${AI_MAX_INPUT_CHARS:2000}
  max-concurrent: ${AI_MAX_CONCURRENT:4}
  max-per-minute: ${AI_MAX_PER_MINUTE:20}
  max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:600}
  chat-timeout-seconds: ${AI_CHAT_TIMEOUT_SECONDS:60}
  daily-budget: ${AI_DAILY_BUDGET:200}
  turn-timeout-seconds: ${AI_TURN_TIMEOUT_SECONDS:90}
  stub-delay-millis: ${AI_STUB_DELAY_MS:0}
app:
  pay-timeout-minutes: ${PAY_TIMEOUT_MINUTES:15}
  rate-limit:
    seckill-per-second: ${SECKILL_RATE_LIMIT:5}
    redeem-per-second: ${REDEEM_RATE_LIMIT:10}
  upload-dir: ${UPLOAD_DIR:./uploads}
  cache:
    shop-max-size: ${SHOP_CACHE_MAX_SIZE:10000}
    shop-ttl-seconds: ${SHOP_CACHE_TTL_SECONDS:10}
logging:
  level:
    com.fullstack.platform: INFO
